<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2458df"><title>日々 — ToDo</title><meta name="description" content="今日のやることと、毎週の積み重ね。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232458df'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header><a class="brand" href="./"><span class="logo">✓</span>日々<span class="brand-sub">ToDo</span></a><span class="local">このブラウザに保存</span></header><main><div class="topline"><div><p class="eyebrow">MY ROUTINE</p><h1>今日の積み重ね。</h1></div><button class="primary" id="add">＋ タスクを追加</button></div><nav aria-label="表示切り替え"><button data-tab="today" class="selected">今日のタスク</button><button data-tab="tasks">タスク一覧</button><button data-tab="history">履歴</button></nav><div id="error" role="alert" hidden></div><div class="layout"><section><div class="datebar"><div class="datecontrols"><button id="prev" class="icon" aria-label="前の日">‹</button><input type="date" id="date" aria-label="表示する日付"><button id="next" class="icon" aria-label="次の日">›</button></div><button id="today" class="quiet">今日</button></div><div id="content"></div></section><aside><section class="week-card"><div class="section-head"><h2>今週の達成状況</h2><span id="week-range"></span></div><div id="week-days"></div><div id="week-progress"></div></section><div class="aside-note">小さな一歩を、ひとつずつ。</div></aside></div></main><footer>日々 <span>自分のペースで続けよう。</span></footer></div><dialog id="editor"><form id="task-form"><div class="modal-head"><h2 id="modal-title">タスクを追加</h2><button type="button" class="icon" id="close" aria-label="閉じる">×</button></div><label>タスク名<input id="name" name="name" required maxlength="80" placeholder="例：本を読む" autocomplete="off"></label><fieldset><legend>頻度</legend><div class="frequency"><label><input type="radio" name="kind" value="interval" checked>N日に1回</label><label><input type="radio" name="kind" value="weekly">週N回</label></div></fieldset><div class="form-row"><label><span id="number-label">何日ごと</span><input id="number" type="number" min="1" max="365" value="1" required></label><label>開始日<input id="start" type="date" required></label></div><p id="edit-note" class="muted" hidden>変更は今日以降に適用されます。履歴は残ります。</p><p id="form-error" role="alert"></p><button class="primary save" type="submit">保存する</button></form></dialog><dialog id="delete-dialog"><h2>タスクを削除しますか？</h2><p id="delete-name"></p><p class="muted">今日以降の提案から外します。記録した履歴は残ります。</p><div class="actions"><button id="cancel-delete">キャンセル</button><button id="confirm-delete" class="danger">削除する</button></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
