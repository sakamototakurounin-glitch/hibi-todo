<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2458df"><title>To Do List</title><meta name="description" content="今日のやることをシンプルに。"><link rel="icon" type="image/svg+xml" href="favicon-v4.svg"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v4.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v4.png"><meta name="apple-mobile-web-app-title" content="To Do List"><meta name="application-name" content="To Do List"><link rel="manifest" href="manifest.webmanifest?v=4"><link rel="stylesheet" href="style.css?v=4"></head><body><div class="shell"><header><a class="brand" href="#today"><img class="logo" src="favicon-v4.svg" width="34" height="34" alt="">To Do List</a><button class="primary" id="add">＋ 追加</button></header><main><nav aria-label="表示切り替え"><button data-tab="today">ToDo</button><button data-tab="tasks">タスク一覧</button><button data-tab="progress">達成状況</button><button data-tab="history">履歴</button></nav><div id="error" role="alert" hidden></div><div class="datebar"><div class="datecontrols"><button id="prev" class="icon" aria-label="前の日">‹</button><input type="date" id="date" aria-label="表示する日付"><button id="next" class="icon" aria-label="次の日">›</button></div><button id="today" class="quiet">今日</button></div><div id="content"></div><div id="pagination" aria-label="リストのページ切り替え"></div></main></div><dialog id="editor"><form id="task-form"><div class="modal-head"><h2 id="modal-title">タスクを追加</h2><button type="button" class="icon" id="close" aria-label="閉じる">×</button></div><label>タスク名<input id="name" required maxlength="80" placeholder="例：本を読む" autocomplete="off"></label><label class="type-field">種類<select id="task-kind"><option value="combined">定期</option><option value="deadline">期限までに</option><option value="ondate">指定日に</option></select></label><div id="routine-fields"><fieldset><legend>頻度</legend><div class="form-row"><label>何日に1回<select id="interval-days"></select></label><label>週に何回<select id="weekly-count"></select></label></div></fieldset><label>開始日<input id="start" type="date"></label></div><label id="scheduled-field" hidden><span id="scheduled-label">期限</span><input id="scheduled-date" type="date"></label><p id="edit-note" class="muted" hidden>変更は今日以降に適用されます。履歴は残ります。</p><p id="form-error" role="alert"></p><button class="primary save" type="submit">保存する</button></form></dialog><dialog id="delete-dialog"><h2>タスクを削除しますか？</h2><p id="delete-name"></p><p class="muted">記録した履歴は残ります。</p><div class="actions"><button id="cancel-delete">キャンセル</button><button id="confirm-delete" class="danger">削除する</button></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js?v=4"></script></body></html>
